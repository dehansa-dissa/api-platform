# Integration test stack for the Azure Service Bus broker driver.
#
# Unlike every other stack in this directory this one is NOT self-contained:
# Service Bus is a hosted service with no container image, so the run needs a
# reachable namespace and APIP_EGW_ASB_CONNECTION_STRING in the environment.
#
#   export APIP_EGW_ASB_CONNECTION_STRING='Endpoint=sb://...;SharedAccessKey=...'
#   make -C it test-asb
#
# The shared access policy needs Manage rights, not just Send and Listen — the
# tests create and delete topics and subscriptions.
#
# No Kafka broker, cert init or UI runs here. One Kafka setting survives as an
# unresolvable placeholder — see the note on APIP_EGW_KAFKA_BROKERS below.

services:
  gateway-controller:
    image: ghcr.io/wso2/api-platform/event-gateway-controller:latest
    command: ["-config", "/etc/gateway-controller/config.toml"]
    ports:
      - "9090:9090"    # Management API
      - "18001:18001"  # Policy xDS (EventChannelConfig)
    environment:
      - APIP_GW_CONTROLLER_STORAGE_TYPE=sqlite
      - APIP_GW_CONTROLLER_STORAGE_SQLITE_PATH=./data/gateway.db
      - APIP_GW_CONTROLLER_LOGGING_LEVEL=info
      - APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_USERNAME=admin
      - APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_PASSWORD_HASH=$$2y$$10$$KZx7AodnpgOthAweR/k2P.xu4kLY7UiFY8Lt2D76mpzzEA6wv7qUO
      - APIP_GW_ROUTER_EVENT__GATEWAY_ENABLED=true
      - APIP_GW_ROUTER_EVENT__GATEWAY_WEBSUB__HUB_URL=http://event-gateway:8080
      - APIP_GW_ROUTER_EVENT__GATEWAY_WEBSUB__HUB_PORT=8080
      - APIP_GW_ROUTER_EVENT__GATEWAY_WEBSUB__HUB__LISTENER__PORT=8080
      - APIP_GW_ROUTER_EVENT__GATEWAY_TIMEOUT__SECONDS=30
      - APIP_GW_GATEWAY_REGISTRATION_TOKEN=${GATEWAY_REGISTRATION_TOKEN:-}
      - APIP_GW_CONTROLPLANE_HOST=${GATEWAY_CONTROLPLANE_HOST:-}

    volumes:
      - controller-data:/app/data
      - ./it/test-config.toml:/etc/gateway-controller/config.toml:ro
      - ../gateway/it/it-aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro
      - ../gateway/gateway-controller/certificates:/app/certificates
      - ../gateway/gateway-controller/listener-certs:/app/listener-certs:ro
    networks:
      - egw-network

  event-gateway:
    image: ghcr.io/wso2/api-platform/event-gateway-runtime:latest
    ports:
      - "8080:8080"   # WebSub HTTP
      - "8443:8443"   # WebSub HTTPS
      - "8081:8081"   # WebSocket
      - "9002:9002"   # Admin API
      - "9003:9003"   # Metrics
    environment:
      # Placeholder only, never dialled: validateKafkaConfig runs unconditionally
      # at startup and rejects an empty broker list, so an ASB-only deployment
      # must still name one. The .invalid TLD (RFC 2606) can never resolve, so a
      # connection attempt would be an unmistakable bug rather than a silent
      # fallback. Tracked for review: validate a driver's config only when a
      # binding uses that driver.
      - APIP_EGW_KAFKA_BROKERS=unused.invalid:9092

      # The namespace comes from the host environment and is never written to a
      # file in this repository.
      - APIP_EGW_ASB_CONNECTION_STRING=${APIP_EGW_ASB_CONNECTION_STRING:?set APIP_EGW_ASB_CONNECTION_STRING before running the ASB stack}
      # Azure's floor is five minutes. The shortest legal value keeps orphaned
      # entities from a crashed run out of the namespace quickly.
      - APIP_EGW_ASB_SUBSCRIPTION_IDLE_TIMEOUT_SECONDS=300

      # Pinned so the driver's internal cache-* and sync-* subscription names
      # stay stable across a restart within one run — the restart scenario
      # cannot work otherwise. Overridable so parallel CI runs against a shared
      # namespace can each take a distinct identity.
      - APIP_EGW_RUNTIME_ID=${APIP_EGW_RUNTIME_ID:-egw-it-asb}

      - APIP_EGW_SERVER_WEBSUB_ENABLED=true
      - APIP_EGW_SERVER_WEBSUB_HTTP_PORT=8080
      - APIP_EGW_SERVER_WEBSUB_HTTPS_PORT=8443
      - APIP_EGW_SERVER_WEBSUB_TLS_ENABLED=true
      - APIP_EGW_SERVER_WEBSUB_TLS_CERT_FILE=/etc/event-gateway/tls/default-listener.crt
      - APIP_EGW_SERVER_WEBSUB_TLS_KEY_FILE=/etc/event-gateway/tls/default-listener.key
      - APIP_EGW_SERVER_WEBSOCKET_PORT=8081
      - APIP_EGW_CONTROLPLANE_ENABLED=true
      - APIP_EGW_LOGGING_LEVEL=debug
      - APIP_EGW_CONTROLPLANE_XDS_ADDRESS=gateway-controller:18001
    extra_hosts:
      # Allow callbacks to services running on the Docker host (useful on Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      - ../gateway/gateway-controller/listener-certs:/etc/event-gateway/tls:ro
      - ./gateway-runtime/configs/config.toml:/etc/event-gateway/config.toml:ro
      # An empty binding set, not the developer's working copy — see the file.
      - ./it/asb-channels.yaml:/etc/event-gateway/channels.yaml:ro
    depends_on:
      gateway-controller:
        condition: service_started
    networks:
      - egw-network

  wh-listener:
    image: event-gateway/webhook-listener:local
    build:
      context: webhook-listener
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    networks:
      - egw-network

networks:
  egw-network:
    driver: bridge

volumes:
  controller-data:
